[project]
name = "actes"
version = "0.1.0"
description = "Capital-composition reconstruction of ARCHEAN TECHNOLOGIES (SIREN 480489707) from its registry filings"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "pillow>=10", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
