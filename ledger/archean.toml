# Reviewed ledger for ARCHEAN TECHNOLOGIES (SIREN 480489707).
#
# One [[step]] = one cap-table state. Each [[step.event]] is a fact read in a filing, with the
# document, the page and a few words copied from the OCR ("lines"). No coordinates are stored here:
# `actes build` resolves the words to OCR line boxes and fails if they are not on the page.
#
# status   CONFIRMED   stated by the documents
#          SUPPORTED   several concordant elements, proof incomplete
#          UNRESOLVED  documents insufficient or contradictory
# "?"      a figure the documents do not give (TOML has no null)

siren = "480489707"
company = "ARCHEAN TECHNOLOGIES"

notes = """
Capital chain (EUR): 37,000 at incorporation (statutes signed 15 Dec 2004) -> 150,000 (17 May 2005) -> 200,000
(20 Oct 2006) -> 100-for-1 nominal split, then 217,241 and 368,102 (27 Jun 2008) -> 217,241 (21 Feb 2017) ->
400,000 (23 Mar 2018), unchanged through the 2059-F tax form for the year ended 31 Dec 2024. HADEAN (SIREN
499979540) has been sole shareholder since 21 Feb 2017.
Every event and state carries a status: CONFIRMED (stated by a filing), SUPPORTED (concordant but incomplete),
UNRESOLVED (documents insufficient or contradictory).
What the filings do not let me settle:
(1) May 2005: the six shareholders after the 113,000 increase are known, their individual counts are not
(shares = null). The EGM of 4 Mar 2005 that decided the increase is not in the corpus.
(2) Aug 2005 to Oct 2006: the EGM of 8 Aug 2005 records BLANCO 823 / AUMONT 617 / GICQUEL 60, the signed
attendance sheet of 20 Oct 2006 records 803 / 637 / 60. No filing explains the 20 shares. I keep both states and
do not invent a transfer. The 2007 HADEAN deed lists a single acquisition by AUMONT (16 Aug 2005), which fits
637 better than 617.
(3) The same 8 Aug 2005 table prints 6.00 % for 60 of 1,500 shares (4.00 %); its percentages add up to 102 %.
(4) The 225-share sale AUMONT -> CAPGRAS was authorised on 20 Oct 2006; its execution date is not filed (at the
latest 7 Sep 2007).
(5) Antonio BLANCO MARINA's 953 shares reach HADEAN between 7 Sep 2007 and 27 Jun 2008 with no deed in the
corpus: the transfer is inferred from HADEAN acting as sole shareholder on 27 Jun 2008.
(6) The 27 Jun 2008 filing is an extract that omits resolutions 12 to 15 naming the subscribers. The four funds
and their counts are back-projected from the 21 Feb 2017 buy-back list; the counts equal round tickets
(375k, 250k, 175k, 75k EUR) at the 2008 price of 5.80 EUR and add up to the 150,861 B shares issued.
(7) 23 Mar 2018: the decision says 182,759, the amended article 6 in the same minutes and in the updated
statutes says 185,759. Only 182,759 reaches 400,000.
(8) Smaller inconsistencies, with no effect on the cap table: the 2007 HADEAN deed says GICQUEL subscribed to the
May 2005 increase although he holds 60 shares before and after it; the two reports of the commissioner for
special benefits give different caps for the A-share dividend (18 June and 22 July 2008); the 2008 minutes split
the B-share premium into two amounts that add up to the whole subscription price plus ten cents; the excess of the
2017 buy-back price is charged to the share premium by the meeting and to other reserves by the president.
(9) The 2006 and 2008 increases are dated by their decision. Their completion dates are not filed.
Events grounded outside the subject's folder: the 2007 and 2008 contributions to HADEAN are in HADEAN's own
filings (499979540). Next steps: pull the missing 4 Mar 2005 minutes, the full 27 Jun 2008 minutes and the share
transfer register entries from INPI, and the BODACC notices for 2008.
"""

